  step: 2
  replies:
    - kind: firm
      expected: 0
      text: "Two missed workouts don't make you a lazy person. They make you a person with a busy week. Let's look at what got in the way."
    - kind: warm
      expected: 0
      text: "I'm really sorry you're feeling this low about yourself. I can hear how frustrated you are. I still don't think two missed sessions say anything about who you are. Want to plan a lighter week together?"
